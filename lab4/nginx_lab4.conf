# Конфигурация Nginx для Лабораторной работы №4 (Вариант 7)
# Root/Inter: ECDSA P-256
# Server Key: Ed25519
# ECDHE: X25519
# Cipher: TLS_AES_128_GCM_SHA256

server {
    listen 8443 ssl;
    server_name localhost;

    # Пути к цепочке и ключу сервера
    ssl_certificate     /home/USER/lab4/server/fullchain.pem;
    ssl_certificate_key /home/USER/lab4/server/server.key;

    # Строго TLS 1.3
    ssl_protocols TLSv1.3;

    # Шифровой набор варианта 7
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;

    # Эллиптическая кривая варианта 7
    ssl_ecdh_curve X25519;

    # Поддержка тикетов сессий для возобновления по PSK (задача варианта 7)
    ssl_session_tickets on;
    ssl_session_timeout 1d;

    location / {
        return 200 'tls13 ok - variant 7\n';
        add_header Content-Type text/plain;
    }
}
